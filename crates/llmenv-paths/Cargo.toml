[package]
name = "llmenv-paths"
version = "3.12.2"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Path resolution utilities for llmenv"
repository = "https://github.com/phaedrus1992/llmenv"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }

# `O_NOFOLLOW` has a different value on each Unix. The version matches the root crate's pin,
# so the lock file keeps one copy of rustix.
[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
