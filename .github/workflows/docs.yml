name: docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
  # No `paths:` here: docs-build is a required status check (#3132), and a PR
  # that never triggers the workflow reports no status, so the check stays
  # pending and blocks merge. The `changes` job gates the build instead, and
  # GitHub counts a job skipped by `if:` as passing.
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            website:
              - 'website/**'
              - '.github/workflows/docs.yml'

  # A unique job id, because the required check is matched by name and other
  # workflows also have a job called `build`.
  docs-build:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: configure pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: install
        run: npm ci
        working-directory: website
      - name: build
        run: npm run build
        working-directory: website
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: website/build

  deploy:
    needs: docs-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Only the deploy shares the Pages group. On the whole workflow, a new run
    # would cancel a pending PR build and leave its required check cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
