# Local git hooks for llmenv, managed by prek (https://github.com/j178/prek).
# Install after cloning:  prek install --hook-type pre-commit --hook-type pre-push
#
# fmt on commit (fast); clippy on push (fast on incremental builds).
# Tests and cargo-deny run in CI only (slow full rebuild).
#
# cargo-hawk (pre-push, #923) links rustc internals, so it must be built with
# the active stable toolchain (see rust-toolchain.toml), with the rust-src/
# rustc-dev/llvm-tools-preview components hawk's own build needs. Install the
# latest release, as CI does (#1584), and install it again after each Rust
# stable update:
#   rustup component add rust-src rustc-dev llvm-tools-preview
#   RUSTC_BOOTSTRAP=1 cargo install --locked cargo-hawk
# Or install a prebuilt release instead (no components/RUSTC_BOOTSTRAP
# needed) — see https://github.com/astral-sh/hawk#installation.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: markdownlint
        name: markdownlint
        entry: markdownlint-cli2
        language: system
        types: [markdown]
        stages: [pre-commit]
      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'cargo clippy --all-features --tests --jobs "$(scripts/core_count.sh)" -- -D warnings'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: changelog-sync
        name: changelog sync check
        entry: bash -c 'scripts/sync-changelog-doc.sh 2>/dev/null; git diff --exit-code website/docs/changelog.md'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-hawk
        name: cargo hawk check
        # -D since #1314 cleared the 330-finding backlog from #923. The script
        # excludes the published `crates/*` libs as external boundaries and is
        # shared with CI so the two invocations can't drift.
        entry: bash scripts/hawk-check.sh -D warnings
        language: system
        pass_filenames: false
        stages: [pre-push]
